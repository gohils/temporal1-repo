version: "3.8"

services:

  temporal-db-init:
    image: temporalio/admin-tools:1.29
    container_name: temporal-db-init
    restart: "no"

    environment:
      DB: postgres12
      DB_PORT: 5432

      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}

      # Azure PostgreSQL TLS
      SQL_TLS_ENABLED: "true"
      SQL_HOST_VERIFICATION: "true"
      SQL_HOST_NAME: ${POSTGRES_HOST}

      # Important for Temporal schema tool stability
      PGSSLMODE: require

    volumes:
      - ./scripts:/scripts

    entrypoint: ["/bin/sh"]
    command: /scripts/setup-postgres.sh

networks:
  temporal-network:
    driver: bridge